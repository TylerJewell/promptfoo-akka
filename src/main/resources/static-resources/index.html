<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>promptfoo-akka — assertion grader</title>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 900px; margin: 2rem auto; color: #1a1a1a; }
  textarea { width: 100%; height: 8rem; font-family: monospace; font-size: 0.85rem; }
  button { padding: 0.5rem 1rem; margin-top: 0.5rem; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { border: 1px solid #ddd; padding: 0.4rem 0.6rem; text-align: left; font-size: 0.9rem; }
  .pass { background: #e6f4ea; color: #1e7e34; font-weight: 600; }
  .fail { background: #fdecea; color: #b3261e; font-weight: 600; }
  h1 { font-size: 1.2rem; }
  #verdict { font-size: 1.1rem; margin-top: 1rem; }
</style>
</head>
<body>
<h1>promptfoo-akka — deterministic assertion grader</h1>
<p>Paste a subject and assertion set (matching the /grade request shape) and submit.</p>
<textarea id="input">{"subject":{"outputString":"hello world"},"assertions":{"assertions":[{"type":"CONTAINS","value":"hello","weight":3,"inverse":false},{"type":"CONTAINS","value":"missing","weight":1,"inverse":false}],"threshold":0.7}}</textarea>
<br>
<button onclick="grade()">Grade</button>
<div id="verdict"></div>
<table id="results" style="display:none">
  <thead><tr><th>#</th><th>Pass</th><th>Score</th><th>Reason</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
async function grade() {
  const body = document.getElementById('input').value;
  const res = await fetch('/grade', { method: 'POST', headers: {'Content-Type':'application/json'}, body });
  const result = await res.json();
  const verdict = document.getElementById('verdict');
  verdict.innerHTML = `<span class="${result.pass ? 'pass' : 'fail'}">${result.pass ? 'PASS' : 'FAIL'}</span>`
    + ` — score ${result.score.toFixed(2)} — ${result.reason}`;
  const rows = document.getElementById('rows');
  rows.innerHTML = '';
  (result.componentResults || []).forEach((c, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i + 1}</td><td class="${c.pass ? 'pass' : 'fail'}">${c.pass ? 'PASS' : 'FAIL'}</td>`
      + `<td>${c.score.toFixed(2)}</td><td>${c.reason}</td>`;
    rows.appendChild(tr);
  });
  document.getElementById('results').style.display = 'table';
}
</script>
</body>
</html>
